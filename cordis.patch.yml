# dsh-butler — bundle patch layer
# 挂一行 loader 记录：注册 butler_sessions / butler_digest / butler_roles / butler_dispatch 四个工具
# 和随包的 butler 技能。下面是默认配置；要改请在 profile 自己的 cordis.patch.yml 里覆盖：
#
#   - id: butler
#     config:
#       maxDispatchesPerHour: 5
#
# 管家本身在侧栏工作区的「…」菜单里按工作区启用，不在这里配置。
- insert:
    - id: butler
      name: dsh-butler
      config:
        maxDispatchesPerHour: 20
        dispatchDelaySeconds: 3
        dryRun: false
